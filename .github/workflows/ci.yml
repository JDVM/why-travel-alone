name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lint warnings fail CI too.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fail on high or critical vulnerabilities in anything installed.
      - run: npm audit --audit-level=high

  # Builds the production image and checks nginx serves the app with its
  # security headers.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --build-arg REACT_APP_API_BASE_URL=https://api.example.com -t why-travel-alone-web .
      - run: docker run -d --name web -p 3000:8080 -e API_ORIGIN=https://api.example.com why-travel-alone-web
      - name: Serves the app, deep links and security headers
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          headers=$(curl -fsSI http://localhost:3000/Trips/1)
          echo "$headers"
          echo "$headers" | grep -i "^content-security-policy:.*connect-src 'self' https://api.example.com"
          echo "$headers" | grep -i "^x-frame-options: DENY"
          echo "$headers" | grep -i "^cache-control: no-cache"
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          # No inline scripts, so the CSP can forbid them.
          ! curl -fsS http://localhost:3000/ | grep -q '<script>'
          # The API address is built in.
          main=$(curl -fsS http://localhost:3000/ | grep -o '/assets/index-[^"]*\.js')
          curl -fsS "http://localhost:3000$main" | grep -q 'https://api.example.com'
      - name: Logs
        if: failure()
        run: docker logs web

  # The browser tests (e2e/) against the whole stack: this app and the API
  # built as production images, MySQL, and Mailpit catching the emails. Uses
  # the API branch with the same name as this one when it exists, so a change
  # that spans both repositories is tested together; otherwise the API's main.
  e2e:
    runs-on: ubuntu-latest
    env:
      APP_SECRET: ci-only-app-secret-at-least-32-characters
      TRUST_PROXY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          path: why-travel-alone
      - name: Pick the API branch
        id: api
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/JDVM/why-travel-alone-api.git "$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          repository: JDVM/why-travel-alone-api
          ref: ${{ steps.api.outputs.ref }}
          path: why-travel-alone-api
      - name: Start the stack (API branch ${{ steps.api.outputs.ref }})
        working-directory: why-travel-alone-api
        run: docker compose --profile web up -d --build
      - uses: actions/setup-node@v6
        with:
          node-version-file: why-travel-alone/.nvmrc
          cache: npm
          cache-dependency-path: why-travel-alone/package-lock.json
      - run: npm ci
        working-directory: why-travel-alone
      - run: npx playwright install --with-deps chromium
        working-directory: why-travel-alone
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && curl -fsS http://localhost:3000/healthz && exit 0
            sleep 2
          done
          exit 1
      - run: npx playwright test
        working-directory: why-travel-alone
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: why-travel-alone/playwright-report
          retention-days: 7
      - name: Logs
        if: failure()
        working-directory: why-travel-alone-api
        run: docker compose --profile web logs
