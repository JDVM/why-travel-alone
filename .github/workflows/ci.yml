name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # react-scripts runs the tests once (not in watch mode) because CI=true.
      - run: npm test
      # With CI=true, lint warnings fail the build.
      - run: npm run build
